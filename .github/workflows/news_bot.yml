name: Daily AI Tech Journalist

on:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Kolkata" # 07:30 IST; GitHub may start scheduled jobs late.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news-import
  cancel-in-progress: false

jobs:
  run-journalist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and save news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_journalist.py
